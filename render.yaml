services:
  - type: web
    name: telegram-terabox-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MOVIES_CHANNEL
        sync: false
      - key: ADULT_CHANNEL
        sync: false
      - key: LOG_CHANNEL
        sync: false
      - key: TARGET_CHANNELS
        sync: false
